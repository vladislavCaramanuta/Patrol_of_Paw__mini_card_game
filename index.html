<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Щенячий Патруль — Найди пару!</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 40%, #e53935 100%);
      font-family: 'Nunito', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    /* ─── Stars background ─── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.15) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    /* ─── Header ─── */
    header {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo {
      font-size: 3rem;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 4px 0 #b71c1c, 0 6px 12px rgba(0,0,0,.4);
      letter-spacing: 2px;
    }

    .paw-icon { display: inline-block; animation: bounce 1s infinite alternate; }

    @keyframes bounce {
      from { transform: translateY(0); }
      to   { transform: translateY(-8px); }
    }

    .subtitle {
      color: #ffeb3b;
      font-size: 1.2rem;
      text-shadow: 0 2px 6px rgba(0,0,0,.4);
      margin-top: 4px;
    }

    /* ─── Stats bar ─── */
    .stats {
      display: flex;
      gap: 24px;
      margin-bottom: 20px;
    }

    .stat-box {
      background: rgba(255,255,255,.15);
      backdrop-filter: blur(6px);
      border: 2px solid rgba(255,255,255,.3);
      border-radius: 16px;
      padding: 8px 22px;
      color: #fff;
      font-size: 1.1rem;
      font-weight: 700;
      text-align: center;
    }

    .stat-box span { display: block; font-size: 1.6rem; color: #ffeb3b; }

    /* ─── Controls ─── */
    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    .btn {
      padding: 10px 28px;
      border: none;
      border-radius: 30px;
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: 1rem;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s;
      box-shadow: 0 4px 0 rgba(0,0,0,.25);
    }
    .btn:active { transform: translateY(3px); box-shadow: none; }

    .btn-primary   { background: #ffeb3b; color: #1a237e; }
    .btn-secondary { background: #ff7043; color: #fff; }

    .difficulty-select {
      padding: 10px 18px;
      border-radius: 30px;
      border: 2px solid rgba(255,255,255,.4);
      background: rgba(255,255,255,.15);
      color: #fff;
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      outline: none;
    }

    .difficulty-select option { color: #1a237e; background: #fff; }

    /* ─── Grid ─── */
    #grid {
      display: grid;
      gap: 12px;
      justify-content: center;
    }

    /* ─── Card ─── */
    .card {
      width: 110px;
      height: 130px;
      perspective: 800px;
      cursor: pointer;
    }

    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform .5s cubic-bezier(.4,0,.2,1);
      border-radius: 18px;
    }

    .card.flipped .card-inner  { transform: rotateY(180deg); }
    .card.matched .card-inner  { transform: rotateY(180deg); }
    .card.matched .card-front  { animation: matchPulse .5s ease; }

    @keyframes matchPulse {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    .card-front, .card-back {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    /* Back face (hidden state) */
    .card-back {
      background: linear-gradient(145deg, #1565c0, #0d47a1);
      border: 3px solid rgba(255,255,255,.3);
      box-shadow: 0 6px 20px rgba(0,0,0,.35);
      font-size: 2.8rem;
    }

    .card-back::after {
      content: '🐾';
      font-size: 2.5rem;
      opacity: .9;
    }

    /* Front face (revealed state) */
    .card-front {
      transform: rotateY(180deg);
      border: 3px solid rgba(255,255,255,.5);
      box-shadow: 0 6px 20px rgba(0,0,0,.3);
    }

    .card-front .pup-svg { width: 88px; height: 88px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .card-front .pup-svg svg { width: 100%; height: 100%; }
    .card-front .pup-name  {
      font-size: .72rem;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,.6);
      margin-top: 4px;
      letter-spacing: .5px;
    }

    .card.matched .card-front {
      opacity: .6;
      cursor: default;
    }

    /* ─── Win overlay ─── */
    #win-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.6);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    #win-overlay.show { display: flex; }

    .win-box {
      background: linear-gradient(135deg, #1565c0, #e53935);
      border: 4px solid #ffeb3b;
      border-radius: 28px;
      padding: 40px 50px;
      text-align: center;
      color: #fff;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
      animation: popIn .4s cubic-bezier(.175,.885,.32,1.275);
    }

    @keyframes popIn {
      from { transform: scale(.5); opacity: 0; }
      to   { transform: scale(1);  opacity: 1; }
    }

    .win-box h2 { font-size: 2.2rem; text-shadow: 0 3px 0 rgba(0,0,0,.3); }
    .win-box p  { font-size: 1.1rem; margin: 10px 0 24px; color: #ffe082; }
    .win-trophy { font-size: 4rem; margin-bottom: 8px; }

    /* ─── Responsive ─── */
    @media (max-width: 600px) {
      .card { width: 80px; height: 96px; }
      .card-front .pup-svg { width: 60px; height: 60px; }
      .logo { font-size: 2rem; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <span class="paw-icon">🐾</span> Щенячий Патруль
  </div>
  <div class="subtitle">Найди пару щенку!</div>
</header>

<div class="stats">
  <div class="stat-box">Ходов<span id="moves">0</span></div>
  <div class="stat-box">Пары<span id="pairs-found">0 / 0</span></div>
  <div class="stat-box">Время<span id="timer">0:00</span></div>
</div>

<div class="controls">
  <select class="difficulty-select" id="difficulty">
    <option value="easy">Легко (4×3)</option>
    <option value="medium" selected>Средне (4×4)</option>
    <option value="hard">Сложно (5×4)</option>
  </select>
  <button class="btn btn-primary" id="start-btn">▶ Играть</button>
</div>

<div id="grid"></div>

<!-- Win overlay -->
<div id="win-overlay">
  <div class="win-box">
    <div class="win-trophy">🏆</div>
    <h2>Отличная работа!<br>Щенки найдены! 🐶</h2>
    <p id="win-msg"></p>
    <button class="btn btn-primary" id="play-again-btn">Играть снова</button>
  </div>
</div>

      svg: `<svg viewBox="0 0 100 115" xmlns="http://www.w3.org/2000/svg"><ellipse cx="19" cy="72" rx="11" ry="16" fill="#C49A6C" transform="rotate(-8 19 72)"/><ellipse cx="81" cy="72" rx="11" ry="16" fill="#C49A6C" transform="rotate(8 81 72)"/><ellipse cx="19" cy="73" rx="7" ry="11" fill="#E8C08C" transform="rotate(-8 19 73)"/><ellipse cx="81" cy="73" rx="7" ry="11" fill="#E8C08C" transform="rotate(8 81 73)"/><ellipse cx="50" cy="77" rx="33" ry="27" fill="#D4B07A"/><ellipse cx="50" cy="86" rx="14" ry="10" fill="#E8C890"/><ellipse cx="50" cy="36" rx="32" ry="17" fill="#00838f"/><ellipse cx="50" cy="28" rx="20" ry="13" fill="#00acc1"/><rect x="18" y="49" width="64" height="9" rx="4" fill="#006064"/><circle cx="50" cy="28" r="8" fill="#80deea"/><text x="50" y="32" text-anchor="middle" font-size="9" fill="#006064" font-weight="bold">&#9733;</text><circle cx="37" cy="73" r="7.5" fill="white"/><circle cx="63" cy="73" r="7.5" fill="white"/><circle cx="39" cy="73" r="4" fill="#1a1a1a"/><circle cx="65" cy="73" r="4" fill="#1a1a1a"/><circle cx="40.5" cy="71.5" r="1.5" fill="white"/><circle cx="66.5" cy="71.5" r="1.5" fill="white"/><ellipse cx="50" cy="82" rx="5" ry="3.5" fill="#1a1a1a"/><path d="M43 90 Q50 96 57 90" stroke="#1a1a1a" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>`
    },
    {
      name: 'Либерти', color: ['#7e57c2','#512da8'],
      svg: `<svg viewBox="0 0 100 115" xmlns="http://www.w3.org/2000/svg"><ellipse cx="18" cy="76" rx="10" ry="22" fill="#8B5E3C" transform="rotate(10 18 76)"/><ellipse cx="82" cy="76" rx="10" ry="22" fill="#8B5E3C" transform="rotate(-10 82 76)"/><ellipse cx="18" cy="77" rx="6.5" ry="16" fill="#C49A6C" transform="rotate(10 18 77)"/><ellipse cx="82" cy="77" rx="6.5" ry="16" fill="#C49A6C" transform="rotate(-10 82 77)"/><ellipse cx="50" cy="78" rx="32" ry="26" fill="#A07848"/><ellipse cx="50" cy="87" rx="13" ry="9" fill="#B8905A"/><ellipse cx="50" cy="33" rx="28" ry="16" fill="#7b1fa2"/><circle cx="50" cy="21" r="12" fill="#9c27b0"/><circle cx="50" cy="21" r="8" fill="#ab47bc"/><text x="50" y="25" text-anchor="middle" font-size="9" fill="white" font-weight="bold">L</text><rect x="21" y="44" width="58" height="8" rx="3" fill="#6a1b9a"/><circle cx="37" cy="74" r="7.5" fill="white"/><circle cx="63" cy="74" r="7.5" fill="white"/><circle cx="39" cy="74" r="4" fill="#1a1a1a"/><circle cx="65" cy="74" r="4" fill="#1a1a1a"/><circle cx="40.5" cy="72.5" r="1.5" fill="white"/><circle cx="66.5" cy="72.5" r="1.5" fill="white"/><ellipse cx="50" cy="83" rx="4.5" ry="3" fill="#1a1a1a"/><path d="M44 91 Q50 97 56 91" stroke="#1a1a1a" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>`
    },
  ];

  const DIFFICULTY = {
    easy:   { cols: 4, count: 6  },
    medium: { cols: 4, count: 8  },
    hard:   { cols: 5, count: 10 },
  };

  // ─── State ──────────────────────────────────────────────────────
  let cards = [], flipped = [], matched = 0, total = 0;
  let moves = 0, timerInterval = null, seconds = 0, locked = false;

  // ─── DOM refs ───────────────────────────────────────────────────
  const grid       = document.getElementById('grid');
  const movesEl    = document.getElementById('moves');
  const pairsEl    = document.getElementById('pairs-found');
  const timerEl    = document.getElementById('timer');
  const winOverlay = document.getElementById('win-overlay');
  const winMsg     = document.getElementById('win-msg');
  const startBtn   = document.getElementById('start-btn');
  const againBtn   = document.getElementById('play-again-btn');
  const diffSel    = document.getElementById('difficulty');

  // ─── Helpers ────────────────────────────────────────────────────
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function formatTime(s) {
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  }

  // ─── Timer ──────────────────────────────────────────────────────
  function startTimer() {
    clearInterval(timerInterval);
    seconds = 0;
    timerEl.textContent = '0:00';
    timerInterval = setInterval(() => {
      seconds++;
      timerEl.textContent = formatTime(seconds);
    }, 1000);
  }

  function stopTimer() {
    clearInterval(timerInterval);
  }

  // ─── Build grid ─────────────────────────────────────────────────
  function buildGrid() {
    const { cols, count } = DIFFICULTY[diffSel.value];
    const selectedPups = shuffle([...PUPS]).slice(0, count);
    const pairs = shuffle([...selectedPups, ...selectedPups]);

    total = count;
    matched = 0;
    moves = 0;
    flipped = [];
    locked = false;

    movesEl.textContent = '0';
    pairsEl.textContent = `0 / ${total}`;
    winOverlay.classList.remove('show');

    grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    grid.innerHTML = '';

    pairs.forEach((pup, idx) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.pupName = pup.name;

      card.innerHTML = `
        <div class="card-inner">
          <div class="card-back"></div>
          <div class="card-front" style="background: linear-gradient(145deg, ${pup.color[0]}, ${pup.color[1]})">
            <div class="pup-svg">${pup.svg}</div>
            <div class="pup-name">${pup.name}</div>
          </div>
        </div>`;

      card.addEventListener('click', () => onCardClick(card));
      grid.appendChild(card);
    });

    startTimer();
  }

  // ─── Card click ─────────────────────────────────────────────────
  function onCardClick(card) {
    if (locked) return;
    if (card.classList.contains('flipped')) return;
    if (card.classList.contains('matched')) return;

    card.classList.add('flipped');
    flipped.push(card);

    if (flipped.length === 2) {
      locked = true;
      moves++;
      movesEl.textContent = moves;

      const [a, b] = flipped;
      if (a.dataset.pupName === b.dataset.pupName) {
        // Match!
        setTimeout(() => {
          a.classList.add('matched');
          b.classList.add('matched');
          flipped = [];
          locked = false;
          matched++;
          pairsEl.textContent = `${matched} / ${total}`;
          if (matched === total) onWin();
        }, 400);
      } else {
        // No match
        setTimeout(() => {
          a.classList.remove('flipped');
          b.classList.remove('flipped');
          flipped = [];
          locked = false;
        }, 900);
      }
    }
  }

  // ─── Win ────────────────────────────────────────────────────────
  function onWin() {
    stopTimer();
    let stars = '⭐⭐⭐';
    if (moves > total * 2.5) stars = '⭐⭐';
    if (moves > total * 4)   stars = '⭐';
    winMsg.textContent = `${stars}  Ходов: ${moves} · Время: ${formatTime(seconds)}`;
    winOverlay.classList.add('show');
  }

  // ─── Events ─────────────────────────────────────────────────────
  startBtn.addEventListener('click', buildGrid);
  againBtn.addEventListener('click', buildGrid);

  // Auto-start on load
  buildGrid();
</script>
</body>
</html>
